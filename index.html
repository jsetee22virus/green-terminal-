<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN TERMINAL</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020704; color: #00ff66; font-family: Consolas, Monaco, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .panel { position: relative; z-index: 1; min-height: 100%; display: grid; place-content: center; text-align: center; padding: 24px; text-shadow: 0 0 8px #00ff66; }
  h1 { font-size: clamp(2rem, 8vw, 5rem); letter-spacing: .12em; margin: 0 0 12px; }
  .sub { color: #8dffb5; font-size: clamp(.8rem, 2.5vw, 1rem); letter-spacing: .2em; }
  .terminal { margin: 28px auto 0; width: min(620px, 92vw); padding: 18px; border: 1px solid #00a844; background: #001309cc; box-shadow: 0 0 28px #00ff6633; text-align: left; line-height: 1.8; font-size: clamp(.75rem, 2.5vw, .95rem); }
  .cursor { display: inline-block; width: 9px; height: 1em; background: #00ff66; vertical-align: middle; animation: blink .8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .note { margin-top: 18px; color: #55bd7c; font-size: .72rem; }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<main class="panel">
  <h1>GREEN TERMINAL</h1>
  <div class="sub">SYSTEM ONLINE · VISUAL SIMULATION</div>
  <section class="terminal" aria-label="Terminal de demonstração">
    <div>[ OK ] Initializing interface...</div>
    <div>[ OK ] Loading green environment...</div>
    <div>[ OK ] Secure visual mode enabled</div>
    <div id="line">user@green-terminal:~$ <span class="cursor"></span></div>
  </section>
  <div class="note">SIMULAÇÃO VISUAL · NENHUM SISTEMA ESTÁ SENDO ACESSADO</div>
</main>
<script>
const c = document.getElementById('matrix'), ctx = c.getContext('2d');
const chars = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&';
let font = 16, drops = [];
function resize() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols = Math.ceil(innerWidth / font);
  drops = Array(cols).fill(1);
}
function draw() {
  ctx.fillStyle = 'rgba(2,7,4,0.09)'; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle = '#00ff66'; ctx.font = font + 'px monospace';
  for (let i=0; i<drops.length; i++) {
    const ch = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(ch, i*font, drops[i]*font);
    if (drops[i]*font > innerHeight && Math.random() > .975) drops[i] = 0;
    drops[i]++;
  }
  requestAnimationFrame(draw);
}
addEventListener('resize', resize); resize(); draw();
</script>
</body>
</html>
